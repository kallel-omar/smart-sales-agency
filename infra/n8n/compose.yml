services:
  n8n:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.30.5}
    container_name: ${N8N_CONTAINER_NAME:-smart-sales-task285-n8n}
    restart: "no"
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-0.0.0.0}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY before starting n8n}
      N8N_USER_MANAGEMENT_DISABLED: "true"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${TZ:-UTC}
      SSA_FASTAPI_BASE_URL_FROM_N8N: ${SSA_FASTAPI_BASE_URL_FROM_N8N:?Set SSA_FASTAPI_BASE_URL_FROM_N8N}
      SSA_INBOUND_INTEGRATION_KEY: ${SSA_INBOUND_INTEGRATION_KEY:?Set SSA_INBOUND_INTEGRATION_KEY}
      SSA_INBOUND_HMAC_SECRET: ${SSA_INBOUND_HMAC_SECRET:?Set SSA_INBOUND_HMAC_SECRET}
      SSA_OUTBOUND_HMAC_SECRET: ${SSA_OUTBOUND_HMAC_SECRET:?Set SSA_OUTBOUND_HMAC_SECRET}
      SSA_WHATSAPP_CLOUD_INTEGRATION_KEY: ${SSA_WHATSAPP_CLOUD_INTEGRATION_KEY:-}
      SSA_WHATSAPP_CLOUD_HMAC_SECRET: ${SSA_WHATSAPP_CLOUD_HMAC_SECRET:-}
      WHATSAPP_CLOUD_VERIFY_TOKEN: ${WHATSAPP_CLOUD_VERIFY_TOKEN:-}
      WHATSAPP_CLOUD_APP_SECRET: ${WHATSAPP_CLOUD_APP_SECRET:-}
      WHATSAPP_CLOUD_ACCESS_TOKEN: ${WHATSAPP_CLOUD_ACCESS_TOKEN:-}
      WHATSAPP_CLOUD_PHONE_NUMBER_ID: ${WHATSAPP_CLOUD_PHONE_NUMBER_ID:-}
      WHATSAPP_CLOUD_GRAPH_API_BASE_URL: ${WHATSAPP_CLOUD_GRAPH_API_BASE_URL:-https://graph.facebook.com}
      WHATSAPP_CLOUD_GRAPH_API_VERSION: ${WHATSAPP_CLOUD_GRAPH_API_VERSION:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro

volumes:
  n8n_data:
