name: Python tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: task297
          POSTGRES_PASSWORD: task297
          POSTGRES_DB: task297
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U task297 -d task297"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install project dependencies
        run: pip install -e ".[dev]"

      - name: Run automated tests
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://task297:task297@localhost:5432/task297
          OUTBOUND_WEBHOOK_URL: " "
        run: python -m pytest

      - name: Build production Docker image
        run: docker build -t smart-sales-agency:test .
